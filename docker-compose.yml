services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerhound
      POSTGRES_PASSWORD: ledgerhound
      POSTGRES_DB: ledgerhound
    ports:
      - "5432:5432"
    volumes:
      - ledgerhound-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerhound -d ledgerhound"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ledgerhound:ledgerhound@db:5432/ledgerhound
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    volumes:
      - ./config:/app/config:ro
    command: ["lh", "--help"]

volumes:
  ledgerhound-pgdata:
