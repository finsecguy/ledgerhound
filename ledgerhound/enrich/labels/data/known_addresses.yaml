  # No freely-available, verifiable bulk dataset of cross-chain bridge
  # contract addresses was found reachable at authoring time (DefiLlama's
  # bridge address API requires a paid plan; the project repos checked
  # don't publish a clean machine-readable deployment manifest). Shipping
  # this empty rather than guessing addresses from memory — a wrong bridge
  # label would make fund-flow tracing silently stop or mis-terminate at
  # the wrong node, which is worse than tracing one hop further than
  # necessary. Populate by adding another `chain`/`addresses` block below
  # with the same shape once you have a source you trust.
  - chain: eth
    label_type: bridge
    label: null
    source: null
    retrieved_at: null
    confidence: null
    notes: >-
      Empty: no verified public dataset available at authoring time. See
      README "Known Limitations".
    addresses: []

  # Real exchange deposit addresses come from proprietary chain-analytics
  # clustering (Chainalysis, TRM, etc.) or paid data, not a free bulk
  # public dataset. Shipped empty per the same reasoning as bridges above,
  # by explicit decision when this milestone was scoped: a fabricated
  # exchange-address seed set would be actively misleading in a security
  # product. The loader/matcher below is fully wired — drop a real dataset
  # in with the same shape to populate it.
  - chain: eth
    label_type: exchange
    label: null
    source: null
    retrieved_at: null
    confidence: null
    notes: >-
      Empty by design — see labels/known.py module docstring and README
      "Known Limitations".
    addresses: []
