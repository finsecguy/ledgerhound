# Source registry consumed by `lh collect`.
#
# `name` must match a Collector implementation registered in
# ledgerhound.collect.REGISTRY (see ledgerhound/collect/__init__.py).
# `url` is the canonical reference for the feed (documentation / provenance);
# the concrete fetch endpoint(s) are owned by the collector implementation.
# `reliability_grade` follows the NATO/Admiralty source-reliability scale
# (A = completely reliable ... F = reliability cannot be judged). These feeds
# are automated or community-maintained blocklists. ScamSniffer and URLhaus
# are graded B (usually reliable). CryptoScamDB is graded C (fairly
# reliable): entries are community submissions with lighter review.
sources:
  - name: scamsniffer
    type: phishing_feed
    url: https://github.com/scamsniffer/scam-database
    cadence_minutes: 60
    reliability_grade: B
    enabled: true

  - name: urlhaus
    type: phishing_feed
    url: https://urlhaus.abuse.ch/
    cadence_minutes: 15
    reliability_grade: B
    enabled: true

  - name: cryptoscamdb
    type: phishing_feed
    url: https://api.cryptoscamdb.org/v1/scams
    cadence_minutes: 360
    reliability_grade: C
    enabled: true
