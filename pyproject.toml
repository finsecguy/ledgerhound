[project]
name = "ledgerhound"
version = "0.1.0"
description = "Crypto-scam campaign intelligence pipeline: collection, extraction, enrichment, clustering, and reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ledgerhound" }]

dependencies = [
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "base58>=2.1",
    "pycryptodome>=3.20",
    "idna>=3.8",
    "defusedxml>=0.7",
    "dnspython>=2.6",
    "networkx>=3.3",
    "stix2>=3.0.2",
    "jinja2>=3.1",
    "markdown>=3.6",
    "weasyprint>=62.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ledgerhound = "ledgerhound.cli:main"
lh = "ledgerhound.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "freezegun>=1.5",
    "stix2-validator>=3.3",
    "types-Markdown>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerhound"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["base58.*", "tenacity.*", "defusedxml.*", "networkx.*", "stix2.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
